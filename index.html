<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MadBoost.gg — Platform Overview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap">
<style>
:root{--bg:#fff;--ink:#111;--mute:#5a5a62;--line:#e3e3e8;--soft:#f6f6f8;--brand:#F26D3D;--brandink:#111;--hi:#c62828;--mid:#b26a00;--lo:#2e7d32;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121214;--ink:#f2f2f4;--mute:#a4a4ae;--line:#2c2c32;--soft:#1b1b1f;--hi:#ff7b72;--mid:#e3b341;--lo:#6fcf7a}}
:root[data-theme="dark"]{--bg:#121214;--ink:#f2f2f4;--mute:#a4a4ae;--line:#2c2c32;--soft:#1b1b1f;--hi:#ff7b72;--mid:#e3b341;--lo:#6fcf7a}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 Archivo,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.cover{background:var(--brand);color:#111;min-height:100vh;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(24px,5vw,64px)}
.cover img{width:clamp(120px,22vw,200px);height:auto;border-radius:24px;display:block}
.cover h1{font-size:clamp(40px,8vw,92px);line-height:1;margin:0 0 16px;font-weight:800;letter-spacing:-.03em;max-width:12ch}
.cover p{margin:0;font-size:18px;max-width:46ch}
.cover .meta{display:flex;gap:32px;flex-wrap:wrap;font-size:14px;border-top:2px solid #111;padding-top:16px}
.cover .meta b{display:block;font-size:12px;font-weight:600;opacity:.7}
main{max-width:920px;margin:0 auto;padding:48px 24px 80px}
section{margin-top:56px}
h2{font-size:30px;line-height:1.15;margin:0 0 16px;letter-spacing:-.02em;font-weight:800;border-left:8px solid var(--brand);padding-left:14px}
h3{font-size:18px;margin:28px 0 8px}
p{margin:0 0 14px;max-width:72ch}
.lead{font-size:19px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:20px 0}
.kpi{background:var(--soft);border-radius:10px;padding:16px;border-top:4px solid var(--brand)}
.kpi b{display:block;font-size:22px;line-height:1.2}
.kpi span{color:var(--mute);font-size:14px}
.tw{overflow-x:auto;margin:12px 0 20px;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:14.5px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--soft);font-weight:600}
tr:last-child td{border-bottom:0}
.tag{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12.5px;font-weight:600;border:1.5px solid currentColor;white-space:nowrap}
.H{color:var(--hi)}.M{color:var(--mid)}.L{color:var(--lo)}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch;margin:16px 0}
.flow div{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:14px;flex:1 1 130px}
.flow div:nth-child(odd){border-top:3px solid var(--brand)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.box{border:1px solid var(--line);border-radius:10px;padding:16px}
.box h3{margin-top:0}
ul{margin:0;padding-left:20px}li{margin:4px 0}
.callout{background:var(--brand);color:#111;border-radius:12px;padding:20px 24px;margin:20px 0}
.callout p{margin:0}
code{font:13px ui-monospace,Menlo,Consolas,monospace;background:var(--soft);padding:1px 5px;border-radius:4px}
footer{border-top:1px solid var(--line);margin-top:64px;padding-top:16px;color:var(--mute);font-size:13px}
@media print{.cover{min-height:auto;height:100vh;break-after:page}section{break-inside:avoid-page}body{font-size:12px}}
</style>
